<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <title>geocorp.io — Logo concepts</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; background: #050c16; color: #f5f8fd; font-family: system-ui, sans-serif; }
    main { max-width: 1320px; padding: 48px 24px 64px; margin: auto; }
    header { margin-bottom: 32px; }
    h1 { font-size: 34px; font-weight: 550; letter-spacing: -.045em; margin: 0 0 10px; }
    h1 span { color: #ff304e; }
    p { color: #92a4bc; line-height: 1.6; margin: 0; }
    .grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 28px; }
    figure { margin: 0; overflow: hidden; background: #091421; border: 1px solid #1a2a3d; border-radius: 16px; }
    .image { display: block; background: #061321; }
    img { display: block; width: 100%; height: auto; aspect-ratio: 1; object-fit: contain; }
    figcaption { display: flex; justify-content: space-between; gap: 16px; align-items: center; padding: 20px; }
    strong { font-size: 16px; font-weight: 550; }
    small { display: block; color: #90a2b9; font-size: 13px; margin-top: 5px; line-height: 1.5; }
    a { color: #d0e4ff; text-underline-offset: 4px; }
    a:focus-visible { outline: 3px solid #ed354d; outline-offset: 3px; }
    .download { font-size: 13px; white-space: nowrap; }
    footer { margin-top: 28px; color: #7f91a8; font-size: 13px; line-height: 1.6; }
    @media (max-width: 640px) { main { padding: 28px 16px; } .grid { grid-template-columns: 1fr; gap: 20px; } }
  </style>
</head>
<body>
  <main>
    <header><h1>geocorp<span>.io</span></h1><p>Four logo directions. Open any image at its original size.</p></header>
    <div class="grid">
      <figure>
        <a class="image" href="01-orbital-g.png"><img src="01-orbital-g.png" alt="Orbital G logo concept for geocorp.io"></a>
        <figcaption><div><strong>01 · Orbital G</strong><small>Earth, a continuous G, and a red polar orbit</small></div><a class="download" href="01-orbital-g.png" download>Download PNG</a></figcaption>
      </figure>
      <figure>
        <a class="image" href="02-coordinate-monogram.png"><img src="02-coordinate-monogram.png" alt="Coordinate GC logo concept for geocorp.io"></a>
        <figcaption><div><strong>02 · Coordinate GC</strong><small>Geometric monogram with a cyan coordinate accent</small></div><a class="download" href="02-coordinate-monogram.png" download>Download PNG</a></figcaption>
      </figure>
      <figure>
        <a class="image" href="03-horizon-g.png"><img src="03-horizon-g.png" alt="Horizon G logo concept for geocorp.io"></a>
        <figcaption><div><strong>03 · Horizon G</strong><small>Minimal planetary geometry and a horizon accent</small></div><a class="download" href="03-horizon-g.png" download>Download PNG</a></figcaption>
      </figure>
      <figure>
        <a class="image" href="04-global-wordmark.png"><img src="04-global-wordmark.png" alt="Global Wordmark logo concept for geocorp.io"></a>
        <figcaption><div><strong>04 · Global Wordmark</strong><small>Custom lowercase lettering with an integrated globe</small></div><a class="download" href="04-global-wordmark.png" download>Download PNG</a></figcaption>
      </figure>
    </div>
    <footer>Descriptions reflect the requested directions. Native generation outputs; no inspection or testing performed.</footer>
  </main>
</body>
</html>
