  <title id="light-0-geo-title">GeoPoliticalMedia — World Dialogue icon</title>
  <desc id="light-0-geo-description">A red globe becomes a speech bubble, pairing worldwide reporting with commentary, interviews and conversation. White meridians remain open and simple.</desc>

