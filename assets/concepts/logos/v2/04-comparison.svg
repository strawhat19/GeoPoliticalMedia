<title id="comparison-title">GeoPoliticalMedia — logo concepts v2</title>
<desc id="comparison-description">Three additional directions in red, navy and white: a globe speech mark, a broadcasting aperture, and an editorial G with a serif masthead. Each includes a transparent editable source and a dark presentation.</desc>
