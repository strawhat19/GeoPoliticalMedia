  <circle id="geo-world-edge" class="geo-world-edge" cx="100" cy="92" r="48" fill="none" stroke="#FFFFFF" stroke-width="4"/>
  <g id="geo-world-meridians" class="geo-world-meridians" clip-path="url(#geo-dialogue-grid-clip)" fill="none" stroke="#FFFFFF" stroke-width="3.2">
    <ellipse cx="100" cy="92" rx="19" ry="48"/>
    <path d="M52 92H148M57 68Q100 80 143 68M57 116Q100 104 143 116"/>
  </g>
</g>
<text id="geo-wordmark" class="geo-wordmark" x="254" y="140" font-family="Arial, Helvetica, sans-serif" font-size="66" font-weight="700" letter-spacing="-2.5" fill="#0B1A2B"><tspan>GeoPolitical</tspan><tspan fill="#E52539">Media</tspan></text>
</svg>
