<svg
  id="01-world-dialogue"
  class="geopoliticalmedia-logo"
  xmlns="http://www.w3.org/2000/svg"
  viewBox="0 0 1100 240"
  role="img"
  aria-labelledby="geo-title geo-description"
>
  <title id="geo-title">GeoPoliticalMedia — World Dialogue wordmark</title>
  <desc id="geo-description">A red globe becomes a speech bubble, pairing worldwide reporting with commentary, interviews and conversation. White meridians remain open and simple. Paired with the exact GeoPoliticalMedia name.</desc>
<g id="geo-lockup-mark" class="geo-lockup-mark" transform="translate(12 14) scale(1.06)">
  <defs>
    <clipPath id="geo-dialogue-grid-clip"><circle cx="100" cy="92" r="48"/></clipPath>
  </defs>
