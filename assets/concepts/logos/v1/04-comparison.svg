  <title id="light-1-geo-title">GeoPoliticalMedia — Studio Frame icon</title>
  <desc id="light-1-geo-description">Four red viewfinder corners frame a dark circular camera lens with a white play aperture. A small red live signal links the editorial website, video channel and recording studio.</desc>

