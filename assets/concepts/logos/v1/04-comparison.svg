<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1800 1080" role="img" aria-labelledby="comparison-title comparison-description">
<title id="comparison-title">GeoPoliticalMedia — first logo concepts</title>
<desc id="comparison-description">Three original editable directions in red, navy and white, shown with light and dark presentations: Orbital G, Studio Frame and Editorial GPM.</desc>
<rect width="1800" height="1080" fill="#F1F3F5"/>
<text x="60" y="72" font-family="Arial, Helvetica, sans-serif" font-size="36" font-weight="700" fill="#0B1A2B">GeoPoliticalMedia</text>
<text x="60" y="108" font-family="Arial, Helvetica, sans-serif" font-size="17" letter-spacing="2" fill="#637081">LOGO CONCEPTS / V1</text>
<text x="1740" y="86" text-anchor="end" font-family="Arial, Helvetica, sans-serif" font-size="16" letter-spacing="2" fill="#637081">NEWS · VIDEO · STUDIO</text>

<rect x="60" y="154" width="540" height="650" rx="18" fill="#FFFFFF"/>
<text x="90" y="204" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="700" fill="#0B1A2B">01 — Orbital G</text>
<text x="90" y="235" font-family="Arial, Helvetica, sans-serif" font-size="12" letter-spacing="1.8" fill="#687585">G / GLOBE / ORBIT</text>
<svg x="180" y="280" width="300" height="300"
  id="light-0-01-orbital-g-icon"
  class="geopoliticalmedia-logo"
  xmlns="http://www.w3.org/2000/svg"
  viewBox="0 0 200 200"
  role="img"
  aria-labelledby="light-0-geo-title light-0-geo-description"
>
  <title id="light-0-geo-title">GeoPoliticalMedia — Orbital G icon</title>
  <desc id="light-0-geo-description">A geometric G embraces a gridded globe while a red inclined orbit extends beyond the letter. An editable continuation of the existing G, Earth and red-orbit identity.</desc>

  <defs>
    <clipPath id="light-0-geo-globe-clip"><circle cx="100" cy="100" r="43"/></clipPath>
  </defs>
  <path id="light-0-geo-g-letter" class="geo-g-letter" d="M155.9 53.1A73 73 0 1 0 172.4 109.5H141" fill="none" stroke="#0B1A2B" stroke-width="18" stroke-linejoin="round"/>
  <circle id="light-0-geo-earth" class="geo-earth" cx="100" cy="100" r="43" fill="#0B1A2B"/>
  <g id="light-0-geo-globe-grid" class="geo-globe-grid" clip-path="url(#light-0-geo-globe-clip)" fill="none" stroke="#FFFFFF" stroke-width="2.3" opacity=".85">
    <ellipse cx="100" cy="100" rx="18" ry="43"/>
    <path d="M58 100H142M62 80Q100 92 138 80M62 120Q100 108 138 120"/>
  </g>
  <ellipse id="light-0-geo-red-orbit" class="geo-red-orbit" cx="100" cy="100" rx="26" ry="94" transform="rotate(34 100 100)" fill="none" stroke="#E52539" stroke-width="7.5"/>
</svg>
